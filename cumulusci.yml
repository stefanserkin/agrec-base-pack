minimum_cumulusci_version: '4.3.0'
project:
    name: agrec-base-pack
    package:
        name: agrec-base-pack
        namespace: agrec
        api_version: '62.0'
    git:
        default_branch: 'main'
    test:
        name_match: '%_Test%'
    source_format: sfdx
    dependencies:
        - namespace: TP2
          version: 3.5
        - namespace: TREX1
          version: 57.0

tasks:
    assign_base_admin_permset:
        description: Assigns the admin permset to the running user
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            apex: >
                PermissionSet ps = [SELECT Id FROM PermissionSet WHERE Name = 'agrec_Base_Pack_Admin' LIMIT 1];
                insert new PermissionSetAssignment(
                    PermissionSetId = ps.Id,
                    AssigneeId = UserInfo.getUserId()
                );

    configure_scratch_user:
        description: Updates the default user to eastern time
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            apex: >
                User u = [SELECT Id, TimeZoneSidKey FROM User WHERE Alias = 'UUser' LIMIT 1];
                u.TimeZoneSidKey = 'America/New_York';
                update u;
    
    dx_deploy:
        description: Deploy metadata to the org using the new command
        class_path: cumulusci.tasks.sfdx.SFDXOrgTask
        options:
            command: "project deploy start --ignore-conflicts"
            
    dx_retrieve:
        description: Retrieve metadata from the org using the new command
        class_path: cumulusci.tasks.sfdx.SFDXOrgTask
        options:
            command: "project retrieve start --ignore-conflicts"

    robot:
        options:
            suites: robot/agrec-base-pack/tests
            options:
                outputdir: robot/agrec-base-pack/results

    robot_testdoc:
        options:
            path: robot/agrec-base-pack/tests
            output: robot/agrec-base-pack/doc/agrec-base-pack_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 85

flows:
    config_dev:
        steps:
            10:
                task: configure_scratch_user
            11:
                task: assign_base_admin_permset

    config_managed:
        steps:
            10:
                task: configure_scratch_user
            11:
                task: assign_base_admin_permset

orgs:
    scratch:
        build:
            config_file: orgs/build.json